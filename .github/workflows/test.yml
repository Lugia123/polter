# The one workflow this fork can actually run.
#
# Everything that was here before came from upstream Ghostty and asked for
# `namespace-profile-ghostty-*` runners, which belong to that project. In this
# fork nothing ever claimed those jobs, so they sat in `queued` forever --
# indistinguishable, in the Actions list, from a job that is running.
#
# So this one uses GitHub's own runners and does the two things that are worth
# knowing on every push: the tree compiles, and the tests pass.
name: Test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux defaults to the GTK app runtime (`apprt/runtime.zig`), and
          # GitHub's runner has no GTK4 development libraries -- so the build
          # fails before it reaches any of this fork's own code. `none` still
          # compiles the whole core and all of `src/poltergeist/`, which is
          # what this job is for.
          - os: ubuntu-latest
            args: "-Dapp-runtime=none"
          - os: macos-latest
            args: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # `-Demit-macos-app=false` and `-Demit-xcframework=false` keep the macOS
      # job from starting Xcode: the app bundle is not what this is checking,
      # and building it turns a five-minute job into a long one.
      - name: Build
        run: zig build -Demit-macos-app=false -Demit-xcframework=false ${{ matrix.args }}

      - name: Test
        run: zig build test -Demit-macos-app=false -Demit-xcframework=false ${{ matrix.args }} --summary all

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Only the directories this fork owns. `src/renderer` and `src/apprt`
      # carry upstream formatting this fork has no reason to churn.
      - name: zig fmt
        run: zig fmt --check src/poltergeist src/cli src/build
