[package]
name = "polter-control-room"
version = "0.1.0"
edition = "2021"
publish = false

# What the control room is, apart from the window that draws it
# (dev-docs/poltergeist/control-room.md, 3.4): the host cannot be tested off
# Windows, so whatever can be wrong without looking wrong lives out here.
#
# `look` is generated from `src/input/control-room-look.json`; the macOS host
# has the same data. The rest reads the core's snapshot and says where things
# go: the same job `macos/Sources/Features/ControlRoom/ControlRoomList.swift`
# does, held to the same answers by `tools/control-room-hosts-agree.py`.
#
# No dependencies, and that includes a JSON library: `src/json.rs` reads the
# one document this needs. `cargo test -p polter-control-room` therefore runs
# anywhere, with nothing to fetch.
[dependencies]
