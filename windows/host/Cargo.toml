[package]
name = "polter-host"
version = "0.1.0"
edition = "2021"
publish = false

# **Two binaries, one source, and the difference is the Windows subsystem.**
#
# `polter-host` is the GUI: it must not have a console, or every run puts a
# second window on the screen scrolling the log (reported by the user; that is
# what `windows_subsystem = "windows"` was for).
#
# `polter-cli` is the same program linked for the console subsystem, and it is
# what a `+action` runs inside a terminal -- the chat tab above all. A GUI
# subsystem process does not attach to the console that started it, and a
# ConPTY pseudoconsole is a console: spawned into a tab, the GUI build got no
# std handles at all, so the chat TUI's first `GetConsoleMode` failed with
# `InvalidHandle` and the tab was dead 146 ms after it appeared.
#
# The subsystem is chosen per binary in `build.rs`, not by
# `#![windows_subsystem]`, because that attribute belongs to the crate root
# and one crate root cannot answer twice. See the note where it used to be, in
# `src/main.rs`.
#
# ⚠️ **Cargo prints a warning about this and it is expected:**
#
#     file `.../src/main.rs` found to be present in multiple build targets:
#       * `bin` target `polter-cli`
#       * `bin` target `polter-host`
#
# **Do not fix it by giving `polter-cli` its own root file.** The obvious
# shape -- `src/bin/polter-cli.rs` with `#[path = "../main.rs"] mod host;` --
# does not compile: inside that module every `crate::` path in these four
# thousand lines would resolve to the new root instead of to this one, and
# `crate::tabs::…` is on nearly every page.
#
# The other way out is splitting the crate into a library and two thin
# binaries. That is a structural change with its own reading, and it was
# deliberately not done alongside a bug fix -- one change, one variable. If
# the warning is worth removing, it is worth its own round.
[[bin]]
name = "polter-host"
path = "src/main.rs"

[[bin]]
name = "polter-cli"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    # `GetUserPreferredUILanguages` and `ResolveLocaleName`, for the plugin
    # settings page: a plugin carries its own translations and this is how the
    # host finds out which of them to read.
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Security_Cryptography",
    # `WriteFile` and `GetStdHandle`, for the panic hook only. It reports
    # through the raw handles rather than `std::io::Stderr` because a panic
    # hook runs while the panicking thread still holds every lock it had, and
    # `Stderr` is a re-entrant lock around a `RefCell` -- re-entering it from
    # inside a failed write is a second panic, and `panic while panicking`
    # aborts with *less* output than doing nothing would have produced.
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    # `WriteFile` is gated on this one as well -- it takes an `OVERLAPPED`.
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    # `HIGHCONTRASTW`, so the dark drawing can stand aside when a person has
    # turned high contrast on. Without it the port would have to declare the
    # struct itself, which is a second copy of an operating system fact.
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies]
# **Chosen over hand-writing a parser, and the reason is the judge, not the
# code.** The settings file is written here and read by `Plugin.zig`, so the
# failure that matters is "the two implementations disagree" -- and a
# hand-written parser with its own unit tests proves only that it agrees with
# itself. The cross-implementation check is a fixture this host writes and a
# Zig test reads (`test "settings written by the Windows host"`), and that
# check works the same whichever parser is underneath. Once the judge is the
# same, the 200 lines are just 200 lines.
serde_json = "1"

# The #[implement] macro expands to paths rooted at `windows_core`, so it has
# to be a direct dependency even though `windows` re-exports the same types.
windows-core = "0.62"


# Declared, not yet called: the split layout lives in its own crate and is
# reached by path, never copied. Copying it here would throw away the reason
# it is testable on macOS, and this directory has already paid once for a
# fork that had to be merged back by hand.
[dependencies.polter-split-tree]
path = "../split-tree"

# Whether a command line asks for a CLI action or for a window. Out here for
# the same reason as the two below: the rule has to agree with the core's
# `detectIter`, disagreeing with it is silent -- the symptom of the last
# disagreement was `polter-cli.exe --help` starting a resident instance -- and
# a test for it is only worth having if it runs where the port is written.
[dependencies.polter-cliargs]
path = "../cliargs"

# Whether an `open_url` may be handed to `ShellExecuteW`. See the crate note:
# an OSC 8 target is chosen by whatever is running in the terminal, which
# makes this a security rule, and a security rule has to be testable where it
# is written.
[dependencies.polter-urlpolicy]
path = "../urlpolicy"

# The quoting rules for dropped paths. Out here rather than in `dnd.rs`
# because a rule about spaces and quotes is exactly the kind that is wrong
# quietly, and a test for it is only useful if it runs where the code is
# written -- which `polter-host` cannot do.
[dependencies.polter-droppath]
path = "../droppath"
