<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Text</title>
<!--
  The `edit-text` plugin's preview page (task 2779 S7).

  **Read-only, and it says so by what it calls.** The page uses exactly three
  of the preview bridge's eight calls -- `info`, `read` and `look` -- and never
  `propose`, `dirty`, `readRel`, `openPath` or `watch`. There is no edit
  button because there is nothing here that can edit: the manifest declares
  neither `edits` nor `hands_edit_to`, so a page that drew one would be
  promising a change screen the host never grows.

  **The file's bytes come from `window.polter`, not from a URL.** `read`
  hands back base64 of a span of the ticket's own file, and every byte of it
  went through the core's `files_resolve(token, rel)`, which judges the path
  against the ticket's scope. **This page never builds a path and never
  fetches one**: no `fetch`, no `XMLHttpRequest`, no `<img src>` at a local
  path. `connect-src 'none'` in the host's policy is what would stop a
  request anyway; not making one is what makes that policy a second line
  rather than the only one.

  **A file too large to show is said to be too large.** `info` gives the size
  before anything is read, and `read` answers with `truncated`, which is about
  the ask rather than the file. Both are shown: "that is all of it" and "that
  is all you were given" are different sentences and the page must not print
  the first when it means the second.

  **Nothing here decides whether the file may be read.** A refusal arrives as
  a rejected promise carrying the core's own words, and it is printed as it
  arrived. The page has no second opinion about the scope.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    font-family: var(--font-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
    font-size: var(--size-body, 13px);
    background: var(--well, Canvas); color: var(--text, CanvasText);
  }
  header {
    flex: 0 0 auto; display: flex; align-items: baseline; gap: 8px;
    padding: 6px 10px; border-bottom: 1px solid var(--line, rgba(128,128,128,.3));
    color: var(--text-secondary, inherit);
  }
  header .name { color: var(--text, CanvasText); font-weight: 600; }
  header .meta { margin-left: auto; font-variant-numeric: tabular-nums; }
  header .badge {
    border: 1px solid var(--line, rgba(128,128,128,.4));
    border-radius: var(--radius-card, 4px); padding: 0 5px;
    color: var(--text-tertiary, inherit); font-size: .85em;
  }
  main { flex: 1 1 auto; min-height: 0; overflow: auto; }
  #text {
    display: block; width: 100%; height: 100%; resize: none; border: 0; outline: none;
    background: transparent; color: inherit; margin: 0; padding: 10px 12px;
    font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    font-size: var(--size-body, 13px); line-height: var(--line-height, 1.5);
    white-space: pre; tab-size: 4;
  }
  [hidden] { display: none !important; }
  footer {
    flex: 0 0 auto; position: relative; display: flex; align-items: center;
    gap: 12px; padding: 3px 10px; font-size: 12px;
    border-top: 1px solid var(--line, rgba(128,128,128,.3));
    color: var(--text-secondary, inherit); font-variant-numeric: tabular-nums;
  }
  .zoom { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  button { font: inherit; color: inherit; background: transparent; border: 0; cursor: pointer; padding: 3px 6px; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--text-secondary, Highlight); }
  #zoom-menu {
    position: absolute; right: 12px; bottom: 100%; padding: 12px;
    background: var(--well, Canvas); border: 1px solid var(--line, GrayText);
    border-radius: var(--radius-card, 4px);
  }
  #zoom-slider { writing-mode: vertical-lr; direction: rtl; width: 20px; height: 120px; }
  .notice {
    margin: 10px 12px; padding: 8px 10px;
    border: 1px solid var(--line, rgba(128,128,128,.3));
    border-radius: var(--radius-card, 4px);
    background: var(--panel, transparent); color: var(--text-secondary, inherit);
  }
  .notice.problem { color: var(--problem, #c0392b); }
  .empty { padding: 16px 12px; color: var(--text-tertiary, inherit); }
</style>
</head>
<body>
<header>
  <span class="name" id="name">&nbsp;</span>
  <span class="badge" id="badge"></span>
  <span class="meta" id="meta"></span>
</header>
<main>
  <textarea id="text" readonly wrap="off" spellcheck="false" hidden></textarea>
  <div class="empty" id="empty"></div>
</main>
<footer id="status" hidden>
  <span id="position"></span><span id="lines"></span><span id="indent"></span>
  <span id="encoding"></span><span id="eol"></span>
  <div class="zoom">
    <button id="zoom-out" type="button">−</button>
    <button id="zoom-percent" type="button" aria-expanded="false" aria-controls="zoom-menu">100%</button>
    <button id="zoom-in" type="button">+</button>
    <div id="zoom-menu" hidden><input id="zoom-slider" type="range" min="50" max="200" step="25" value="100" orient="vertical"></div>
  </div>
</footer>

<script>
(function () {
  "use strict";

  // The most this page will decode and draw. **The host's own ceiling rather
  // than a number invented here**: `PreviewRoutes.readMax` is what `read`
  // will answer with at most, so asking for more would only come back short.
  var READ_MAX = 4 * 1024 * 1024;

  var strings = {
    en: {
      loading: "Reading the file…",
      size: "size",
      empty: "This file is empty.",
      notText: "This file is not text, so there is nothing to show here.",
      truncated: "Showing the first {Shown} of {Total}. The rest is not loaded.",
      // **A different sentence, because it is a different fact.** When the
      // host did not say how big the file is there is no total to print, and
      // the one above would print `{Total}` as nothing -- "of , the rest is
      // not loaded" -- which reads as a total of zero and still claims there
      // is a rest. Unknown size and a known remainder are two answers.
      truncatedUnknown: "Showing {Shown}. The file's total size is unknown; there may be more.",
      refused: "The preview could not be shown: {Why}",
      noBridge: "This page was opened without the preview bridge, so the file cannot be read.",
      encoding: "encoding",
      eol: "end of line",
      position: "Ln {Line}, Col {Column}", lines: "{Count} lines", spaces: "Spaces: 4",
      lineEnding: "End of Line: {EOL}", mixed: "Mixed", none: "None", otherEncoding: "Other encoding",
      zoomOut: "Zoom Out", zoomIn: "Zoom In", zoom: "Zoom"
    },
    "zh-Hans": {
      loading: "正在读取文件…",
      size: "大小",
      empty: "这个文件是空的。",
      notText: "这个文件不是文本，没有可以显示的内容。",
      truncated: "只显示了前 {Shown}（共 {Total}），其余没有加载。",
      truncatedUnknown: "已显示 {Shown}。文件总大小未知，可能还有内容。",
      refused: "没法显示这份预览：{Why}",
      noBridge: "这个页面没有带着预览桥打开，所以读不到文件。",
      encoding: "编码",
      eol: "换行",
      position: "行 {Line}，列 {Column}", lines: "{Count} 行", spaces: "空格: 4",
      lineEnding: "换行: {EOL}", mixed: "混合", none: "无", otherEncoding: "其他编码",
      zoomOut: "缩小", zoomIn: "放大", zoom: "缩放"
    }
  };
  var lang = (navigator.language || "en").toLowerCase();
  var L = strings[lang.indexOf("zh") === 0 ? "zh-Hans" : "en"];
  function say(key, vars) {
    var s = (window.polterTextPreviewStrings || {})[key] || L[key] || strings.en[key] || key;
    if (!vars) return s;
    for (var k in vars) s = s.split("{" + k + "}").join(vars[k]);
    return s;
  }

  var el = {
    name: document.getElementById("name"),
    badge: document.getElementById("badge"),
    meta: document.getElementById("meta"),
    text: document.getElementById("text"),
    empty: document.getElementById("empty"),
    status: document.getElementById("status"), position: document.getElementById("position"),
    lines: document.getElementById("lines"), indent: document.getElementById("indent"),
    encoding: document.getElementById("encoding"), eol: document.getElementById("eol"),
    zoomOut: document.getElementById("zoom-out"), zoomIn: document.getElementById("zoom-in"),
    zoomPercent: document.getElementById("zoom-percent"), zoomMenu: document.getElementById("zoom-menu"),
    zoomSlider: document.getElementById("zoom-slider")
  };

  var zoom = 100, baseSize = 13, baseLineHeight = 19.5;
  function setZoom(value) {
    zoom = Math.max(50, Math.min(200, Number(value)));
    document.documentElement.style.setProperty("--size-body", baseSize * zoom / 100 + "px");
    document.documentElement.style.setProperty("--line-height", baseLineHeight * zoom / 100 + "px");
    el.zoomPercent.textContent = zoom + "%";
    el.zoomSlider.value = String(zoom);
  }
  function updatePosition() {
    var before = el.text.value.slice(0, el.text.selectionStart || 0);
    var rows = before.split(/\r\n|\r|\n/);
    // Textarea's native selection and arrow navigation use UTF-16 offsets;
    // count Unicode codepoints for the displayed column instead.
    el.position.textContent = say("position", { Line: rows.length, Column: Array.from(rows[rows.length - 1]).length + 1 });
  }
  function showStatus(info, text) {
    el.status.hidden = false;
    el.lines.textContent = say("lines", { Count: text.split(/\r\n|\r|\n/).length });
    el.indent.textContent = say("spaces");
    el.encoding.textContent = ({ utf8: "UTF-8", utf8_bom: "UTF-8 BOM" })[info.encoding] || say("otherEncoding");
    var ending = ({ lf: "LF", crlf: "CRLF", mixed: say("mixed"), none: say("none") })[info.eol] || say("none");
    el.eol.textContent = ending;
    el.eol.title = say("lineEnding", { EOL: ending });
    el.text.setSelectionRange(0, 0);
    updatePosition();
  }
  el.text.addEventListener("click", updatePosition);
  el.text.addEventListener("keyup", updatePosition);
  el.text.addEventListener("select", updatePosition);
  document.addEventListener("selectionchange", updatePosition);
  el.zoomOut.setAttribute("aria-label", say("zoomOut"));
  el.zoomIn.setAttribute("aria-label", say("zoomIn"));
  el.zoomPercent.setAttribute("aria-label", say("zoom"));
  el.zoomSlider.setAttribute("aria-label", say("zoom"));
  el.zoomOut.addEventListener("click", function () { setZoom(zoom - 25); });
  el.zoomIn.addEventListener("click", function () { setZoom(zoom + 25); });
  function closeZoom() { el.zoomMenu.hidden = true; el.zoomPercent.setAttribute("aria-expanded", "false"); }
  el.zoomPercent.addEventListener("click", function () {
    el.zoomMenu.hidden = !el.zoomMenu.hidden;
    el.zoomPercent.setAttribute("aria-expanded", String(!el.zoomMenu.hidden));
    if (!el.zoomMenu.hidden) el.zoomSlider.focus();
  });
  el.zoomSlider.addEventListener("input", function () { setZoom(el.zoomSlider.value); });
  document.addEventListener("click", function (event) {
    if (!el.zoomMenu.contains(event.target) && event.target !== el.zoomPercent) closeZoom();
  });
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape" && !el.zoomMenu.hidden) { closeZoom(); el.zoomPercent.focus(); return; }
    if (!event.metaKey || event.ctrlKey || event.altKey || event.isComposing) return;
    if (event.key === "+" || event.key === "=") setZoom(zoom + 25);
    else if (event.key === "-") setZoom(zoom - 25);
    else if (event.key === "0") setZoom(100);
    else return;
    event.preventDefault();
  });

  function bytes(n) {
    if (typeof n !== "number" || !isFinite(n)) return "";
    var units = ["B", "KB", "MB", "GB"], i = 0, v = n;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return (i === 0 ? v : v.toFixed(v < 10 ? 1 : 0)) + " " + units[i];
  }

  /// A failure, in the words the host gave. The bridge rejects with a string
  /// carrying the core's own sentence -- printing something of this page's
  /// instead would lose the one thing that says *why* the preview is empty.
  function failed(why) {
    el.text.hidden = true;
    el.empty.className = "notice problem";
    el.empty.textContent = say("refused", { Why: String(why) });
  }

  function base64ToText(b64) {
    var raw = atob(b64);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    // `fatal: false` rather than throwing: a file that is mostly text but
    // has one bad byte still has something worth reading, and a preview that
    // refused the whole file over it would be withholding more than asked.
    return new TextDecoder("utf-8", { fatal: false }).decode(out);
  }

  /// Whether the core's own reading says this is a file a person can read.
  ///
  /// **The core's tag, and `binary` is one of the tags it really answers.**
  /// `Text.Encoding` is `utf8`, `utf8_bom`, `other`, `binary` (`Text.zig:30`),
  /// so "there is a string here" is not the question -- a PNG answers
  /// `"binary"` and would pass a check that only looked for a non-empty one.
  /// What the core cannot sample answers with `null`, and that is a different
  /// answer again: nothing was read, so the page has no reading to go on and
  /// does not invent one.
  ///
  /// The list is written out rather than compared against `"binary"` alone:
  /// a tag this page has not heard of is a core that learned a new one, and
  /// drawing it as text without knowing that is the guess this check exists
  /// to refuse.
  var READABLE = { utf8: true, utf8_bom: true, other: true };

  function looksTextual(info) {
    return typeof info.encoding === "string" && READABLE[info.encoding] === true;
  }

  function show(info) {
    el.name.textContent = info.name || "";
    if (info.kind && info.kind !== "file") el.badge.textContent = info.kind;
    var parts = [];
    if (typeof info.size === "number") parts.push(bytes(info.size));
    el.meta.textContent = parts.join(" · ");
  }

  async function run() {
    var polter = window.polter;
    if (!polter || typeof polter.info !== "function" || typeof polter.read !== "function") {
      el.empty.className = "notice problem";
      el.empty.textContent = say("noBridge");
      return;
    }

    // The host's own tokens, so this page draws in the colours of the window
    // around it rather than inventing a palette beside it. Asked first and
    // best-effort: a bridge that cannot answer `look` must not stop the file
    // being shown.
    if (typeof polter.look === "function") {
      try {
        var look = await polter.look();
        var root = document.documentElement.style;
        if (look && look.colours) {
          var c = look.colours;
          if (c.text) root.setProperty("--text", c.text);
          if (c.text_secondary) root.setProperty("--text-secondary", c.text_secondary);
          if (c.text_tertiary) root.setProperty("--text-tertiary", c.text_tertiary);
          if (c.well) root.setProperty("--well", c.well);
          if (c.panel) root.setProperty("--panel", c.panel);
          if (c.line) root.setProperty("--line", c.line);
          if (c.problem) root.setProperty("--problem", c.problem);
        }
        if (look && look.font) {
          if (look.font.ui) root.setProperty("--font-ui", "\"" + look.font.ui + "\", system-ui, sans-serif");
          if (look.font.mono) root.setProperty("--font-mono", "\"" + look.font.mono + "\", monospace");
        }
        if (look && look.size) {
          // The host's floor, handed over rather than chosen here: a page set
          // at a literal 13 px goes unreadable the day the system's text size
          // moves (`SettingsFont.minimumPointSize`).
          var body = look.size.body, min = look.size.min;
          var size = typeof min === "number" ? Math.max(body || min, min) : body;
          if (typeof size === "number") baseSize = size;
          if (typeof look.size.line_height === "number") {
            // **px, because the host's number is a height and not a
            // multiple.** `ControlRoomLook.Font.lineHeightTerminal` is a point
            // size (20-ish) that the host measures a row by; a unitless CSS
            // `line-height` is a *multiplier*, so handing the number straight
            // to the property set every line 20 rows apart -- one line of text
            // in a page full of space (root's reading of B). The unit has to
            // be written here rather than guessed from the number: 20 is a
            // plausible multiple as well as a plausible height, which is the
            // whole reason the host names its token in points.
            baseLineHeight = look.size.line_height;
          }
        }
        if (look && look.radius && typeof look.radius.card === "number") {
          root.setProperty("--radius-card", look.radius.card + "px");
        }
      } catch (e) { /* the tokens are a courtesy; the file is the job. */ }
    }

    setZoom(zoom);
    el.empty.textContent = say("loading");

    var info;
    try {
      info = await polter.info();
    } catch (why) { return failed(why); }

    if (!info || typeof info !== "object") {
      return failed("the file could not be described");
    }
    show(info);

    if (info.kind === "directory") {
      el.empty.textContent = say("notText");
      return;
    }
    if (!looksTextual(info)) {
      el.empty.textContent = say("notText");
      return;
    }
    if (info.size === 0) {
      el.empty.textContent = say("empty");
      showStatus(info, "");
      return;
    }

    // A span, not the whole file, even when it fits: `read` answers at most
    // `READ_MAX` and saying what was asked for keeps the two ceilings the
    // same number.
    var length = Math.min(info.size || READ_MAX, READ_MAX);
    var answer;
    try {
      answer = await polter.read(0, length);
    } catch (why) { return failed(why); }

    if (!answer || typeof answer.base64 !== "string") {
      return failed("the file could not be read");
    }

    var text = base64ToText(answer.base64);
    el.text.value = text;
    el.text.textContent = text;
    showStatus(info, text);
    el.text.hidden = false;
    el.empty.className = "empty";
    el.empty.textContent = "";

    // **Whether anything of the file is missing — asked of the file, not of
    // the ask.** The bridge's `truncated` says the answer came back at the
    // length that was asked for, and that is not the same question: this page
    // asks for exactly `min(size, READ_MAX)` bytes, so for any file that fits
    // the answer is cut at the file's own end and `truncated` is true of a
    // file that is shown whole. A page that read that flag as "the file goes
    // on" told every reader that a complete small file was incomplete
    // (measured: 9 bytes of README shown, "only the first 9 B of 9").
    //
    // When the size is known that is a comparison against the size, and
    // **equal is complete**: `read == size` says nothing to warn about. When
    // it is not known there is no file to compare against, so the ask's own
    // boundary is all there is — said as what it is, without inventing a
    // total or claiming the file ends here.
    function shortOf(info, answer, read) {
      if (typeof info.size === "number") return read < info.size;
      return answer.truncated === true;
    }

    // **How many bytes the answer really carries.** `base64.length` counts
    // characters of the encoding, and its last group may be padded with `=`
    // — bytes that were never in the file. `4 chars -> 3 bytes` is exact only
    // once the padding is taken off, and a shorter final group is what the
    // `floor` and the two differences below correct. Over a 4 MB read the
    // error is a few bytes; the point is that the number printed beside "of"
    // is a byte count and has to be one.
    function decodedBytes(b64) {
      var pad = 0;
      if (b64.length > 0 && b64.charAt(b64.length - 1) === "=") pad++;
      if (b64.length > 1 && b64.charAt(b64.length - 2) === "=") pad++;
      return Math.floor(b64.length * 3 / 4) - pad;
    }

    var read = decodedBytes(answer.base64);
    if (shortOf(info, answer, read)) {
      var note = document.createElement("div");
      note.className = "notice";
      // **Which sentence, by whether there is a total to name.** With a size
      // the note is about the file ("of 8.8 KB"); without one it must not
      // borrow that shape -- `bytes(undefined)` is the empty string, so the
      // other sentence would print a blank where a total belongs, which reads
      // as none at all, and go on to say the rest is not loaded.
      var known = typeof info.size === "number";
      note.textContent = known
        ? say("truncated", { Shown: bytes(read), Total: bytes(info.size) })
        : say("truncatedUnknown", { Shown: bytes(read) });
      el.text.parentNode.insertBefore(note, el.text);
    }
  }

  run();
})();
</script>
</body>
</html>
